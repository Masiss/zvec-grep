[package]
name = "e3-retrieval-harness"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zg-engine = { path = "../../../rust/crates/zg-engine", features = ["e4-experiment"] }
